<!doctype html>
<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 | Page not found</title>

    <link rel="stylesheet" href="./assets/css/index.css" />
</head>

<body>
    <main class="error404">
        <div class="error404__bg" aria-hidden="true"></div>

        <section class="error404__content" aria-labelledby="title-404">
            <p class="error404__code">404</p>
            <h1 id="title-404" class="error404__title">Ups… this page doesn´t exist
            </h1>
            <p class="error404__text">
                The url you have entered might be broken , but don´t worry...
            </p>

            <div class="error404__actions">
                <a class="btn btn-primary" href="./index.html">Back to beggining</a>
                <a class="btn" href="./index.html#projects">Go to Work</a>
            </div>

            <!-- Card broma -->
            <div class="error404__card">
                <p class="error404__joke">
                    While you.re here, enjoy this carrousel of my favourite analog images i´ve taken over the years.
                </p>

                <!-- Carrusel (10 fotos) -->
                <div class="error404-carousel" aria-label="Carrusel de fotos favoritas">
                    <div class="error404-track">
                        <img src="assets/img/fotografia/image00002.jpeg" alt="Foto analógica 1" loading="lazy">
                        <img src="assets/img/fotografia/image00003.jpeg" alt="Foto analógica 2" loading="lazy">
                        <img src="assets/img/fotografia/image00004.jpeg" alt="Foto analógica 3" loading="lazy">
                        <img src="assets/img/fotografia/image00025.jpeg" alt="Foto analógica 4" loading="lazy">
                        <img src="assets/img/fotografia/image00006.jpeg" alt="Foto analógica 5" loading="lazy">
                        <img src="assets/img/fotografia/image00015.jpeg" alt="Foto analógica 6" loading="lazy">
                        <img src="assets/img/fotografia/image00019.jpeg" alt="Foto analógica 7" loading="lazy">
                        <img src="assets/img/fotografia/image00012.jpeg" alt="Foto analógica 8" loading="lazy">
                        <img src="assets/img/fotografia/image00026.jpeg" alt="Foto analógica 9" loading="lazy">
                        <img src="assets/img/fotografia/image00019.jpeg" alt="Foto analógica 10" loading="lazy">
                    </div>
                </div>

                <p class="error404__hint">
                    Tip: if you hover over the images, they will stop moving
                </p>
            </div>
        </section>
    </main>

    <style>
        /* ===== Layout base ===== */
        .error404 {
            min-height: 100vh;
            position: relative;
            overflow: hidden;
            background: var(--color-bg-alt);
            display: grid;
            place-items: center;
            padding: clamp(2rem, 6vw, 6rem) 1rem;
            isolation: isolate;
        }

        .error404__content {
            position: relative;
            z-index: 2;
            width: min(92%, 1000px);
            text-align: center;
        }

        .error404__code {
            margin: 0;
            font-weight: 800;
            letter-spacing: -0.06em;
            line-height: 0.85;
            font-size: clamp(6rem, 18vw, 12rem);
            color: rgba(255, 255, 255, 0.92);
            text-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
        }

        .error404__title {
            margin: 1rem 0 0.8rem;
            font-size: clamp(1.8rem, 4.2vw, 3rem);
            letter-spacing: -0.03em;
            color: var(--color-text);
        }

        .error404__text {
            margin: 0 auto 1.75rem;
            max-width: 62ch;
            font-size: var(--text-base);
            line-height: 1.7;
            color: var(--color-text-muted);
        }

        .error404__actions {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: var(--space-md);
            margin-bottom: 2rem;
        }

        /* ===== Fondo gradiente animado ===== */
        .error404__bg {
            position: absolute;
            inset: -20%;
            z-index: 0;
            pointer-events: none;

            /* 3 capas de gradientes (vibrante pero suave) */
            background:
                radial-gradient(circle at 15% 20%, rgba(255, 56, 115, 0.35), transparent 55%),
                radial-gradient(circle at 85% 35%, rgba(111, 66, 255, 0.30), transparent 55%),
                radial-gradient(circle at 50% 85%, rgba(0, 209, 255, 0.18), transparent 55%);

            filter: blur(18px);
            opacity: 0.9;
            transform: translate3d(0, 0, 0);
            animation: bgFloat 14s ease-in-out infinite alternate;
        }

        /* Movimiento “flotante” del fondo */
        @keyframes bgFloat {
            0% {
                transform: translate(-2%, -2%) scale(1.02) rotate(0deg);
            }

            50% {
                transform: translate(2%, -1%) scale(1.06) rotate(2deg);
            }

            100% {
                transform: translate(-1%, 2%) scale(1.10) rotate(-1deg);
            }
        }

        /* Reduce motion */
        @media (prefers-reduced-motion: reduce) {
            .error404__bg {
                animation: none;
            }

            .error404-track {
                animation: none;
            }
        }

        /* ===== Card (glass) ===== */
        .error404__card {
            margin: 0 auto;
            width: min(100%, 980px);
            padding: clamp(1rem, 2.2vw, 1.5rem);
            border-radius: 20px;

            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);

            text-align: left;
        }

        .error404__joke {
            margin: 0 0 1rem;
            color: rgba(245, 245, 245, 0.92);
            font-size: var(--text-base);
            line-height: 1.6;
        }

        .error404__hint {
            margin: 0.9rem 0 0;
            color: rgba(245, 245, 245, 0.65);
            font-size: var(--text-sm);
        }

        /* ===== Carrusel (10 slides, como Photography) ===== */
        .error404-carousel {
            position: relative;
            height: 380px;
            overflow: hidden;
            border-radius: 16px;
            background: #fff;
        }

        .error404-track {
            display: flex;
            height: 100%;
            width: 1000%;
            animation: err-slide-10 40s linear infinite;
        }

        .error404-track img {
            width: 10%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            flex-shrink: 0;
        }

        @keyframes err-slide-10 {
            0% {
                transform: translateX(0%)
            }

            8% {
                transform: translateX(0%)
            }

            12% {
                transform: translateX(-10%)
            }

            20% {
                transform: translateX(-10%)
            }

            24% {
                transform: translateX(-20%)
            }

            32% {
                transform: translateX(-20%)
            }

            36% {
                transform: translateX(-30%)
            }

            44% {
                transform: translateX(-30%)
            }

            48% {
                transform: translateX(-40%)
            }

            56% {
                transform: translateX(-40%)
            }

            60% {
                transform: translateX(-50%)
            }

            68% {
                transform: translateX(-50%)
            }

            72% {
                transform: translateX(-60%)
            }

            80% {
                transform: translateX(-60%)
            }

            84% {
                transform: translateX(-70%)
            }

            92% {
                transform: translateX(-70%)
            }

            96% {
                transform: translateX(-80%)
            }

            100% {
                transform: translateX(-80%)
            }
        }

        .error404-carousel:hover .error404-track {
            animation-play-state: paused;
        }

        @media (max-width: 900px) {
            .error404-carousel {
                height: 240px;
            }

            .error404__card {
                text-align: center;
            }
        }
    </style>
</body>

</html>

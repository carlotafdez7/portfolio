title:
  es: Portfolio creativo de diseño gráfico y fotografía
  en: Creative portfolio for graphic design and photography

abstract:
  es: |
    Portfolio web personal diseñado y desarrollado para presentar
    proyectos de diseño gráfico, ilustración, fotografía analógica,
    motion graphics y branding. El proyecto combina una estética
    editorial con animaciones suaves y un enfoque mobile-first,
    priorizando la jerarquía visual, la accesibilidad y la experiencia
    de usuario.
  en: |
    Personal web portfolio designed and developed to showcase
    graphic design, illustration, analog photography, motion graphics
    and branding projects. The project combines an editorial aesthetic
    with subtle animations and a mobile-first approach, prioritizing
    visual hierarchy, accessibility and user experience.

